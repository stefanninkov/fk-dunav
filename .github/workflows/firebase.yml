name: Firebase deploy

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'functions/**'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install functions deps
        # functions/ doesn't ship a lockfile (the dep surface is small
        # and pinned via caret ranges); use install rather than ci.
        run: npm --prefix functions install
      - name: Build functions
        run: npm --prefix functions run build
      - name: Deploy rules, indexes, functions
        # Storage stays out until Phase 7 enables the bucket + grants the
        # service account the storage-admin role.
        uses: w9jds/firebase-action@v14.2.0
        with:
          args: deploy --only firestore:rules,firestore:indexes,functions --project fk-dunav --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
