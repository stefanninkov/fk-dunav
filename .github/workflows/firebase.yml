name: Firebase deploy

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'functions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install app deps
        run: npm ci --legacy-peer-deps
      - name: Deploy Firestore rules + indexes
        # Storage + Cloud Functions are deferred to Phase 7 / Phase 5
        # respectively — deploying them now hits a 403 because the
        # service account doesn't have the Storage/Functions enable-API
        # permissions and there aren't real functions or storage rules
        # to ship yet. Add --only storage,functions here once those
        # phases land and IAM is granted.
        uses: w9jds/firebase-action@v14.2.0
        with:
          args: deploy --only firestore:rules,firestore:indexes --project fk-dunav
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
